name: agent-orchestrator-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt ruff pip-audit
      - name: Compile
        run: python -m compileall -q orchestrator.py tests
      - name: Lint
        run: ruff check orchestrator.py tests
      - name: Tests
        run: python -m pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: CLI smoke test
        run: python orchestrator.py "ci objective" | python -m json.tool >/dev/null
      - name: Build image
        run: docker build -t sky-agent-orchestrator:ci .
      - name: Verify non-root image
        run: test "$(docker run --rm --entrypoint id sky-agent-orchestrator:ci -u)" != "0"
