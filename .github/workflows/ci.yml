name: orchestrator-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q orchestrator.py src tests
      - name: Lint
        run: ruff check orchestrator.py src tests
      - name: Test
        run: python -m pytest -q
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
      - name: Build container
        run: docker build -t sky-orchestrator:ci .
      - name: Verify non-root image
        run: test "$(docker run --rm --entrypoint=id sky-orchestrator:ci -u)" != "0"
